<!doctype html>
<!-- checked by https://validator.w3.org/-->
<html lang="zh-hant">
    <head>
        <title>{{page_title}}</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <link rel="canonical" href="{{page_canonical}}" />
        
        <meta name="description" content="{{page_description}}" />
        
        <meta property="og:title" content="{{page_og_title}}" />
        <meta property="og:description" content="{{page_og_description}}" />
        <meta property="og:image" content="{{page_og_image}}" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="{{page_og_url}}" />
        <meta property="og:site_name" content="{{blog_title}}" />
        
        <meta name="twitter:card" content="{{page_twitter_card}}" />

        <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <noscript><link rel="stylesheet" href="blog.min.css" /></noscript>
        <script src="config.js"></script>
        <script>
            var isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
            var min = isLocal ? "" : ".min";
            var ver = isLocal ? "?v=" + new Date().getTime() : "";
            // 讀取設定檔中的主題，預設為 'blog'
            var themeFile = (typeof AppConfig !== 'undefined' && AppConfig.theme_file) ? AppConfig.theme_file : 'blog';
            var css_load = '<link rel="stylesheet" href="' + themeFile + min + ".css" + ver + '"/>';
            document.write(css_load);
            if (window.location.href.indexOf("?") > -1) {
                var meta = document.createElement("meta");
                meta.name = "robots";
                meta.content = "noindex";
                document.getElementsByTagName("head")[0].appendChild(meta);
            }
        </script>
    </head>

    <body class="{{body_class}}">
        <div class="outermost">
            <div class="head">
                <a href="blog.html" class="blog_name_link">
                    <p id="blog_title_loader" class="blog_name">{{blog_title}}</p>
                </a>
                <p id="blog_comment_loader" class="blog_comment">{{blog_introduce}}</p>
            </div>
            <main id="post_body">
                <!--loading過場動畫start https://css-loaders.com/classic/ -->
                <div id="loading">
                    <br />
                    <div class="loader"></div>
                    <br />
                </div>
                <!--loading過場動畫end-->

                {{page_main_content}}
            </main>
            <div id="footer_body">
                <div id="blog_search">
                    <div id="blog_search_google">
                        <p class="RegionFunctionTitle">文章搜尋服務</p>
                        <div style="width: 98%; margin: auto">
                            <div class="gcse-search"></div>
                        </div>
                    </div>
                </div>
                <div id="AllPostList">
                    <a href="blog_list.html" class="all_a">
                        <p class="all_p">文章總列表</p>
                    </a>
                </div>
                <div id="AllTagList">
                    <p class="RegionFunctionTitle">標籤總列出</p>
                    <div class="tag_list_region" id="tag_list_all"></div>
                </div>
                <div id="AllcategoryList">
                    <p class="RegionFunctionTitle">文章分類</p>
                    <div class="category_list_region" id="category_list_all"></div>
                </div>
                <div id="AllDateList">
                    <p class="RegionFunctionTitle">文章日期列出</p>
                    <div class="date_list_region">
                        <ul id="myUL"></ul>
                    </div>
                </div>
            </div>
        </div>
        <div id="fb-root"></div>

        <template id="tmpl_post_main">
            <article class="post_outermost">
                <div class="post_title_outermost">
                    <p class="post_time">{{time}}</p>
                    <p class="post_title">
                        <a href="{{link}}">{{title}}</a>
                    </p>
                </div>

                <div style="max-width: 100vw; padding: 5px">
                    <div
                        class="fb-like"
                        data-href="{{site_url}}{{link}}"
                        data-width=""
                        data-layout=""
                        data-action=""
                        data-size=""
                        data-share="true"
                    ></div>
                </div>

                <div class="post_content">{{content}}</div>

                <a href="javascript:toTop()" class="top_a">
                    <p class="back_top">(回到最上層 ↑)</p>
                </a>

                <div class="more_div">
                    <a class="more_a" href="{{link}}"><p class="more_p">(繼續閱讀...)</p></a>
                </div>

                {{tags_block}} {{category_block}}
            </article>
        </template>

        <template id="template_category">
            <a href="blog.html?/category/{{name}}" class="category_link">
                <p class="category_p">{{name}} ({{count}})</p>
            </a>
        </template>

        <template id="template_date_post_item">
            <li>
                <div>{{day}}日　<a href="{{link}}" class="date_link">{{title}}</a></div>
            </li>
        </template>

        <template id="template_tag_item">
            <div class="tag_item_region">
                <a href="blog.html?/tag/{{name}}" class="tag_link">
                    <p class="tag_p">{{name}}({{count}})</p>
                </a>
            </div>
        </template>

        <template id="tmpl_post_tag_item">
            <div class="tag_item_region">
                <a href="blog.html?/tag/{{name}}" class="tag_link">
                    <p class="tag_p">{{name}}</p>
                </a>
            </div>
        </template>

        <template id="tmpl_post_cat_item">
            <div class="category_item_region">
                <a href="blog.html?/category/{{name}}" class="category_link">
                    <p class="category_p">{{name}}</p>
                </a>
            </div>
        </template>

        <template id="tmpl_post_tag_container">
            <div class="tags">
                <div><p class="tags_title">文章標籤 :</p></div>
                {{items}}
            </div>
        </template>

        <template id="tmpl_post_cat_container">
            <div class="categorys">
                <div><p class="categorys_title">文章分類 :</p></div>
                {{items}}
            </div>
        </template>

        <template id="tmpl_date_year">
            <li>
                <span class="caret"
                    >{{year}}年　<a href="blog.html?/date_range/{{year}}" class="date_link">({{count}})</a></span
                >
                <ul class="nested" id="year_{{year}}"></ul>
            </li>
        </template>

        <template id="tmpl_date_month">
            <li>
                <span class="caret"
                    >{{mon}}月　<a href="blog.html?/date_range/{{key}}" class="date_link">({{count}})</a></span
                >
                <ul class="nested" id="year_mon_{{key}}"></ul>
            </li>
        </template>

        <template id="tmpl_blog_list_container">
            <article class="post_outermost">
                <div class="post_title_outermost">
                    <h1 class="post_title">文章總列表</h1>
                </div>
                <div class="post_list_border">{{items}}</div>
            </article>
        </template>

        <template id="tmpl_blog_list_item">
            <a href="{{link}}" class="more_a">
                <p class="read_title">{{time}} {{title}}</p>
            </a>
        </template>

        <script>
            document.write('<script src="static/blog' + min + ".js" + ver + '" defer><\/script>');
        </script>
        <script>
            if (typeof AppConfig !== "undefined" && AppConfig.cse_id) {
                var gcse = document.createElement("script");
                gcse.type = "text/javascript";
                gcse.async = true; // 設定為非同步載入
                gcse.src = "https://cse.google.com/cse.js?cx=" + AppConfig.cse_id;
                document.getElementsByTagName("head")[0].appendChild(gcse);
            }
        </script>
    </body>
</html>
