<!DOCTYPE html>
<html lang="zh_TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Board Service</title>
    <!-- CSS will be loaded dynamically based on theme -->
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; background: transparent; }
        .mb-loading-screen { display: flex; justify-content: center; align-items: center; height: 100px; font-family: sans-serif; color: #666; }
        
        /* User Info Row */
        .mb-user-row { display: flex; align-items: center; margin-bottom: 15px; min-height: 40px; }
        .mb-user-badge { display: flex; align-items: center; background: #f0f2f5; padding: 5px 12px; border-radius: 20px; border: 1px solid #ddd; }
        .theme-dark .mb-user-badge { background: #333; border-color: #444; color: #eee; }
        .mb-user-avatar { width: 24px; height: 24px; border-radius: 50%; margin-right: 8px; }
        .mb-user-name { font-size: 0.9em; font-weight: bold; }
        .mb-logout-btn { background: none; border: none; color: #999; margin-left: 8px; cursor: pointer; font-size: 1.2em; line-height: 1; padding: 0 2px; }
        .mb-logout-btn:hover { color: #f44336; }

        /* Avatar in Message List */
        .mb-item-avatar { width: 32px; height: 32px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; background: #eee; }
        .mb-item-meta { display: flex; align-items: center; }
    </style>
</head>
<body>
    <div id="mb-service-container">
        <div class="mb-loading-screen">
            <div class="mb-spinner"></div> Loading...
        </div>
    </div>

    <script>
        // --- 1. Get Context from URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const config = {
            page_id: urlParams.get('page_id') || 'index',
            site_id: urlParams.get('site_id') || '',
            theme: urlParams.get('theme') || 'default',
            lang: urlParams.get('lang') || 'zh_TW',
            page_title: urlParams.get('page_title') || '',
            api_url: urlParams.get('api_url') || '../api/message.php'
        };

        // --- 2. Dynamic Resource Loader ---
        function loadScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => { console.warn('Failed:', src); resolve(); };
                document.head.appendChild(s);
            });
        }

        async function init() {
            const ver = '?v=' + new Date().getTime();
            const basePath = './';
            
            // Load Stylesheet
            const themeSuffix = config.theme === 'default' ? '' : `-${config.theme}`;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = `guestbook${themeSuffix}.css${ver}`;
            document.head.appendChild(link);

            // Load Config & Language & Adapters
            await loadScript(`../config/config.js${ver}`);

            // Load Google GIS if enabled
            const mbConfig = window.MBConfig || {};
            if (mbConfig.google_auth && mbConfig.google_auth.enabled) {
                await loadScript('https://accounts.google.com/gsi/client');
            }

            await loadScript(`../langs/plugin-${config.lang}.js${ver}`);
            await loadScript(`adapter-php.js${ver}`);
            await loadScript(`adapter-gas.js${ver}`);

            // Start Logic
            startMessageBoard();
        }

        // --- 3. Core Logic (Migrated and Refactored) ---
        function startMessageBoard() {
            class MessageBoard {
                constructor() {
                    this.container = document.getElementById('mb-service-container');
                    this.state = { 
                        page: 1, 
                        parent_id: 0,
                        user: this.loadUserSession() // 1. 嘗試從儲存空間恢復
                    };
                    
                    // Defaults
                    this.config = Object.assign({
                        mode: 'local',
                        per_page: 5,
                        gas_url: '',
                        admin: { name: 'Admin', label: '站長' },
                        google_auth: { enabled: false, client_id: '' }
                    }, window.MBConfig || {});

                    // Merge options from URL
                    this.config.theme = config.theme;
                    this.config.lang = config.lang;

                    this.init();
                }

                loadUserSession() {
                    try {
                        const saved = localStorage.getItem('mb_user_session');
                        return saved ? JSON.parse(saved) : null;
                    } catch (e) { return null; }
                }

                saveUserSession(user) {
                    if (user) localStorage.setItem('mb_user_session', JSON.stringify(user));
                    else localStorage.removeItem('mb_user_session');
                }

                async init() {
                    const L = window.MB_LANG || {};
                    
                    // Setup Adapter
                    if (this.config.mode === 'gas') {
                        this.adapter = new window.GASAdapter({ url: this.config.gas_url, site_id: config.site_id });
                    } else {
                        this.adapter = new window.PHPAdapter({ api_url: config.api_url, site_id: config.site_id });
                    }

                    window.esMessageBoardInstance = this; // Global ref for pagination/reply links
                    this.renderBaseLayout();
                    this.renderUserInfo(); // 2. 立即根據恢復的狀態渲染 UI
                    this.initGoogleAuth(); 
                    await this.loadMessages();
                }

                initGoogleAuth() {
                    if (!this.config.google_auth || !this.config.google_auth.enabled || !this.config.google_auth.client_id) return;
                    
                    try {
                        google.accounts.id.initialize({
                            client_id: this.config.google_auth.client_id,
                            callback: (res) => this.handleGoogleResponse(res),
                            auto_select: true // 3. 如果只有一個帳號，嘗試自動選取
                        });
                        this.renderGoogleBtn();
                        
                        // 4. 顯示一鍵登入提示 (如果尚未登入)
                        if (!this.state.user) {
                            google.accounts.id.prompt();
                        }
                    } catch (e) {
                        console.warn('Google Auth init failed:', e);
                    }
                }

                renderGoogleBtn() {
                    const btnContainer = document.getElementById('mb-google-btn-container');
                    if (btnContainer) {
                        google.accounts.id.renderButton(btnContainer, { 
                            theme: config.theme === 'dark' ? 'filled_black' : 'outline', 
                            size: 'medium',
                            shape: 'pill',
                            width: 200 
                        });
                    }
                }

                handleGoogleResponse(response) {
                    // Decode JWT (Base64)
                    const base64Url = response.credential.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                    const payload = JSON.parse(jsonPayload);

                    console.log('Google User:', payload);

                    this.state.user = {
                        sub: payload.sub,
                        name: payload.name,
                        email: payload.email,
                        picture: payload.picture,
                        token: response.credential
                    };

                    this.saveUserSession(this.state.user); // 5. 儲存 Session
                    this.renderUserInfo();
                }

                renderUserInfo() {
                    const L = window.MB_LANG || {};
                    const userInfoEl = document.getElementById('mb-user-info');
                    const nameInput = document.getElementById('mb-name');
                    if (!userInfoEl) return;

                    if (this.state.user) {
                        userInfoEl.innerHTML = `
                            <div class="mb-user-badge">
                                <img src="${this.state.user.picture}" class="mb-user-avatar">
                                <span class="mb-user-name">${this.state.user.name}</span>
                                <button type="button" class="mb-logout-btn" onclick="window.esMessageBoardInstance.logout()">×</button>
                            </div>
                        `;
                        if (nameInput) {
                            nameInput.value = this.state.user.name;
                            nameInput.readOnly = true;
                            nameInput.style.display = 'none';
                        }
                    } else {
                        userInfoEl.innerHTML = '<div id="mb-google-btn-container"></div>';
                        this.renderGoogleBtn();
                        if (nameInput) {
                            nameInput.value = '';
                            nameInput.readOnly = false;
                            nameInput.style.display = 'block';
                        }
                    }
                }

                logout() {
                    this.state.user = null;
                    this.saveUserSession(null); // 6. 清除儲存
                    this.renderUserInfo();
                }

                renderBaseLayout() {
                    const L = window.MB_LANG || {};
                    this.container.innerHTML = `
                        <div class="mb-wrapper theme-${config.theme}">
                            <div class="mb-form-area" id="mb-form">
                                <div id="mb-user-info" class="mb-user-row mb-3">
                                    <div id="mb-google-btn-container"></div>
                                </div>
                                <div id="mb-reply-hint" style="display:none; margin-bottom:10px; color:#4a90e2; font-size:0.9em;">
                                    ${L.reply_hint || 'Reply to: '}<span id="mb-reply-to"></span> <a href="javascript:void(0)" id="mb-cancel-reply" style="margin-left:10px; color:#e74c3c;">${L.cancel_reply || 'Cancel'}</a>
                                </div>
                                <input type="text" id="mb-name" placeholder="${L.placeholder_name || 'Name'}" class="mb-input">
                                <textarea id="mb-content" placeholder="${L.placeholder_content || 'Content'}" class="mb-input mb-textarea"></textarea>
                                <button id="mb-submit" class="mb-btn">${L.submit_btn_text || 'Submit'}</button>
                            </div>
                            <div id="mb-list" class="mb-list-area"><p class="mb-status">${L.status_loading || 'Loading...'}</p></div>
                            <div id="mb-pagination" class="mb-pagination-area"></div>
                        </div>
                    `;
                    document.getElementById('mb-submit').addEventListener('click', () => this.submitComment());
                    document.getElementById('mb-cancel-reply').addEventListener('click', () => this.cancelReply());
                }

                async loadMessages(page = 1) {
                    this.state.page = page;
                    const listEl = document.getElementById('mb-list');
                    const L = window.MB_LANG || {};
                    listEl.innerHTML = `<p class="mb-status">${L.status_loading || 'Loading...'}</p>`;
                    try {
                        const res = await this.adapter.fetch(config.page_id, page, this.config.per_page);
                        const threads = this.organizeThreads(res.messages || [], res.pagination?.active_parents || []);
                        this.renderThreads(threads);
                        this.renderPagination(res.pagination);
                    } catch (err) { listEl.innerHTML = `<p class="mb-error">Error: ${err.message}</p>`; }
                }

                organizeThreads(allMessages, activeParentIds) {
                    const activeIds = activeParentIds.map(String);
                    const threads = {};
                    allMessages.forEach(msg => {
                        if (String(msg.parent_id) === "0") {
                            if (activeIds.includes(String(msg.id))) threads[msg.id] = { head: msg, discussion: [] };
                        }
                    });
                    allMessages.forEach(msg => {
                        if (String(msg.parent_id) !== "0") {
                            const rootId = this.findRootId(msg, allMessages);
                            if (threads[rootId]) threads[rootId].discussion.push(msg);
                        }
                    });
                    return activeIds.map(id => {
                        const thread = threads[id];
                        if (thread) thread.discussion.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                        return thread;
                    }).filter(t => t);
                }

                findRootId(msg, allMessages) {
                    let current = msg; let safety = 0;
                    while (String(current.parent_id) !== "0" && safety < 10) {
                        const parent = allMessages.find(m => String(m.id) === String(current.parent_id));
                        if (!parent) break;
                        current = parent; safety++;
                    }
                    return current.id;
                }

                renderThreads(threads) {
                    const listEl = document.getElementById('mb-list');
                    const L = window.MB_LANG || {};
                    if (threads.length === 0) { listEl.innerHTML = `<p class="mb-empty">${L.status_empty || 'No comments.'}</p>`; return; }
                    listEl.innerHTML = threads.map(thread => {
                        const head = thread.head;
                        const isAdmin = head.name === this.config.admin.name;
                        const headAvatar = head.avatar ? `<img src="${head.avatar}" class="mb-item-avatar">` : `<div class="mb-item-avatar d-none"></div>`;
                        
                        let html = `
                        <div class="mb-thread-box">
                            <div class="mb-topic ${isAdmin ? 'mb-is-admin' : ''}">
                                <div class="mb-item-meta">
                                    ${headAvatar}
                                    <div class="mb-meta-text">
                                        <span class="mb-author">${head.name}${isAdmin ? ` <span class="mb-badge">${L.badge_admin || 'Admin'}</span>` : ''}</span>
                                        <span class="mb-date">${head.created_at}</span>
                                    </div>
                                    <a href="javascript:void(0)" class="mb-reply-link" onclick="window.esMessageBoardInstance.prepareReply('${head.id}', '${head.name.replace(/'/g, "\\'")}')">${L.btn_join || 'Join'}</a>
                                </div>
                                <div class="mb-item-content">${head.content}</div>
                            </div>
                            <div class="mb-discussion">`;
                            
                        html += thread.discussion.map(reply => {
                            const isReplyAdmin = reply.name === this.config.admin.name;
                            const replyAvatar = reply.avatar ? `<img src="${reply.avatar}" class="mb-item-avatar">` : `<div class="mb-item-avatar d-none"></div>`;
                            
                            return `
                            <div class="mb-reply-item ${isReplyAdmin ? 'mb-is-admin' : ''}">
                                <div class="mb-item-meta">
                                    ${replyAvatar}
                                    <div class="mb-meta-text">
                                        <span class="mb-author">${reply.name}${isReplyAdmin ? ` <span class="mb-badge">${L.badge_admin || 'Admin'}</span>` : ''}</span>
                                        <span class="mb-date">${reply.created_at}</span>
                                    </div>
                                    <a href="javascript:void(0)" class="mb-reply-link" onclick="window.esMessageBoardInstance.prepareReply('${head.id}', '${reply.name.replace(/'/g, "\\'")}')">${L.btn_reply || 'Reply'}</a>
                                </div>
                                <div class="mb-item-content">${reply.content}</div>
                            </div>`;
                        }).join('');
                        return html + `</div></div>`;
                    }).join('');
                }

                renderPagination(pagin) {
                    const paginEl = document.getElementById('mb-pagination');
                    if (!pagin || pagin.total_pages <= 1) { paginEl.innerHTML = ''; return; }
                    let html = '<div class="mb-pagin-list">';
                    if (pagin.current_page > 1) html += `<button class="mb-page-btn" onclick="window.esMessageBoardInstance.loadMessages(${pagin.current_page - 1})">&laquo;</button>`;
                    for (let i = 1; i <= pagin.total_pages; i++) { html += `<button class="mb-page-btn ${i === pagin.current_page ? 'active' : ''}" onclick="window.esMessageBoardInstance.loadMessages(${i})">${i}</button>`; }
                    if (pagin.current_page < pagin.total_pages) html += `<button class="mb-page-btn" onclick="window.esMessageBoardInstance.loadMessages(${pagin.current_page + 1})">&raquo;</button>`;
                    paginEl.innerHTML = html + '</div>';
                }

                prepareReply(id, name) {
                    this.state.parent_id = id;
                    document.getElementById('mb-reply-hint').style.display = 'block';
                    document.getElementById('mb-reply-to').innerText = name;
                    document.getElementById('mb-content').focus();
                    document.getElementById('mb-form').scrollIntoView({ behavior: 'smooth' });
                }

                cancelReply() { this.state.parent_id = 0; document.getElementById('mb-reply-hint').style.display = 'none'; }

                async submitComment() {
                    const L = window.MB_LANG || {};
                    const name = document.getElementById('mb-name').value.trim();
                    const content = document.getElementById('mb-content').value.trim();
                    if (!name || !content) return alert(L.msg_no_name_content || 'Required fields missing');
                    const btn = document.getElementById('mb-submit');
                    const originalBtnText = btn.innerText;
                    btn.disabled = true; btn.innerHTML = `<span class="mb-spinner"></span> ${L.msg_sending || 'Sending...'}`;
                    this.container.classList.add('mb-loading');
                    try {
                        await this.adapter.save({ 
                            site_id: config.site_id,
                            page_id: config.page_id,
                            page_title: config.page_title,
                            name, 
                            content, 
                            avatar: this.state.user ? this.state.user.picture : null,
                            google_sub: this.state.user ? this.state.user.sub : null, // Added
                            google_token: this.state.user ? this.state.user.token : null,
                            parent_id: this.state.parent_id 
                        });
                        document.getElementById('mb-content').value = ''; 
                        this.cancelReply(); 
                        await this.loadMessages(1);
                    } catch (err) { alert((L.msg_fail || 'Fail: ') + err.message); } finally { 
                        btn.disabled = false; btn.innerText = originalBtnText; this.container.classList.remove('mb-loading');
                    }
                }
            }
            new MessageBoard();
        }

        // --- 4. Auto-height Sync ---
        function sendHeight() {
            const height = document.documentElement.offsetHeight;
            window.parent.postMessage({ type: 'mb-resize', height: height }, '*');
        }

        window.addEventListener('load', sendHeight);
        const observer = new ResizeObserver(sendHeight);
        observer.observe(document.body);

        init();
    </script>
</body>
</html>
