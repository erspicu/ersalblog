<!DOCTYPE html>
<html lang="{{album_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{album_title}}</title>
    <meta name="description" content="{{album_description}}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{album_title}}">
    <meta property="og:description" content="{{album_description}}">
    <meta property="og:image" content="{{album_preview}}">
    <meta property="og:url" content="{{album_site_url}}">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="static/base.css">
    <script src="config/config.js"></script>
    <script>
        (function() {
            // 從 Hash 中獲取 style 參數
            var getThemeFromUrl = function() {
                var hash = window.location.hash;
                if (hash) {
                    var params = new URLSearchParams(hash.substring(1));
                    return params.get('style');
                }
                return null;
            };

            var theme = getThemeFromUrl() || (typeof albumConfig !== 'undefined' ? albumConfig.theme : 'album');
            window.currentActiveTheme = theme; // 存給底部的 JS 插件載入器使用

            // Always load the theme CSS (now even default 'album' is in themes/)
            document.write('<link rel="stylesheet" id="theme-css" href="static/themes/' + theme + '/theme.css">');
        })();
    </script>
</head>
<body>

<header class="header-bar">
    <div class="header-inner">
        <div class="mb-2">
            <h1 class="site-title">{{album_title}}</h1>
            <span class="site-desc">| &nbsp; {{album_introduce}}</span>
        </div>
        <hr class="divider">
    </div>
</header>

<main class="main-content">
    <div id="album-header-section">
        {{album_header}}
    </div>
    {{content_body}}
    <div id="pagination-container"></div>
</main>

<footer class="footer"><p>&copy; 2026 Baxermux. {{lang_footer_rights}}</p></footer>

<!-- Templates -->
<template id="tmpl_app_container">
    <div id="app-container">
        <div class="text-center py-5">
            <p class="text-muted">{{lang_loading_app}}</p>
        </div>
    </div>
</template>

<template id="tmpl_status_loading">
    <div class="text-center py-5">
        <div class="spinner mb-2"></div>
        <div class="text-muted">{{message}}</div>
    </div>
</template>

<template id="tmpl_status_error">
    <div class="text-center py-5 text-danger">
        <i class="bi bi-exclamation-triangle fs-1 d-block mb-2"></i>
        {{message}}
    </div>
</template>

<template id="tmpl_status_empty">
    <div class="text-center py-5 text-muted">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
        {{message}}
    </div>
</template>

<template id="tmpl_status_loading_small">
    <div class="col-12 text-muted small">
        <span class="spinner-sm me-1"></span> {{message}}
    </div>
</template>

<template id="tmpl_status_empty_small">
    <div class="col-12 text-muted small">{{message}}</div>
</template>

<template id="tmpl_album_grid_container">
    <div class="album-grid" id="{{id}}">{{items}}</div>
</template>

<template id="tmpl_icon_prev">
    <i class="bi bi-chevron-left"></i>
</template>

<template id="tmpl_icon_next">
    <i class="bi bi-chevron-right"></i>
</template>

<template id="tmpl_pagination">
    <div class="pagination">{{items}}</div>
</template>

<template id="tmpl_pagination_item">
    <span class="page-item {{activeClass}} {{disabledClass}}">
        <a class="page-link" href="{{link}}">{{text}}</a>
    </span>
</template>

<template id="tmpl_index_album_item">
    <a href="{{link}}" class="card">
        <div class="card-img-wrap ratio-1-1">
            <img src="{{cover}}" alt="{{name}}" class="card-img">
            <span class="card-badge"><i class="bi bi-images"></i> {{count}}</span>
        </div>
        <div class="card-body">
            <h2 class="card-title">{{name}}</h2>
            <p class="card-desc">{{desc}}</p>
        </div>
    </a>
</template>

<template id="tmpl_album_header">
    <div class="album-header-box">
        <h2 class="fw-bold mb-2" style="font-size:1.25rem">{{name}}</h2>
        {{desc_html}}
    </div>
</template>

<template id="tmpl_album_desc_inline">
    <p class="text-muted small mb-0">{{desc}}</p>
</template>

<template id="tmpl_album_controls">
    <div class="d-flex align-center justify-between mb-4">
        <nav class="breadcrumb">
            <div class="breadcrumb-item"><a href="#">{{lang_home}}</a></div>
            <div class="breadcrumb-item active">{{name}}</div>
        </nav>
        <div class="d-flex align-center gap-2">
            <span class="badge"><i class="bi bi-image"></i> {{total}} {{lang_photos_count}}</span>
            <a href="#" class="btn btn-outline"><i class="bi bi-house-door"></i> {{lang_back_to_home}}</a>
        </div>
    </div>
</template>

<template id="tmpl_album_photo_item">
    <a href="{{photoPageLink}}" class="card">
        <div class="card-img-wrap ratio-3-2">
            <img src="{{imgSrc}}" alt="{{filename}}" class="card-img" loading="lazy">
        </div>
        <div class="card-body text-center" style="padding: 10px;">
            <div class="card-desc">{{photoDesc}}</div>
        </div>
    </a>
</template>

<template id="tmpl_photo_detail_view">
    <div class="d-flex align-center justify-between" style="margin-bottom: 20px;">
        <nav class="breadcrumb">
            <div class="breadcrumb-item"><a href="{{pathToHome}}album.html">{{lang_home}}</a></div>
            <div class="breadcrumb-item"><a href="{{albumLink}}">{{albumName}}</a></div>
            <div class="breadcrumb-item active">{{filename}}</div>
        </nav>
        <a href="{{albumLink}}" class="btn btn-outline"><i class="bi bi-grid-3x3-gap"></i> {{lang_back_to_list}}</a>
    </div>

    <div class="photo-viewer-container">
        <div class="photo-stage">
            <a href="{{prevLink}}" class="nav-btn" style="left:0"><i class="bi bi-chevron-left"></i></a>
            <img id="photo-main-viewer" src="{{imgSrc}}" alt="{{filename}}" onclick="openPhotoModal('{{imgSrcXL}}')" style="cursor:zoom-in">
            <a href="{{nextLink}}" class="nav-btn" style="right:0"><i class="bi bi-chevron-right"></i></a>
        </div>
        <div class="photo-meta-panel" style="padding: 25px; border-top: 1px solid #eee;">
            <div class="photo-meta-grid">
                <!-- Info Column -->
                <div class="info-card">
                    <h6 class="fw-bold mb-2">{{lang_photo_info}}</h6>
                    <p class="fw-bold" style="font-size:1.1rem; margin-bottom: 5px;">{{photoTitle}}</p>
                    <p class="text-muted small" style="margin-bottom: 15px;">{{photoDesc}}</p>
                    <hr class="divider" style="margin-bottom: 15px;">
                    <p class="text-muted small" style="margin-bottom: 15px;">{{lang_filename}}: {{filename}}</p>
                    
                    <a href="{{imgSrcOriginal}}" download="{{filename}}" class="btn btn-primary w-100 mb-2">
                        <i class="bi bi-download"></i> {{lang_download_original}}
                    </a>
                    <button class="btn btn-outline w-100" onclick="openShareModal('{{filename}}', '{{imgSrc}}', '{{imgSrcXL}}', '{{imgSrcOriginal}}', '{{shortIdStart}}')">
                        <i class="bi bi-share"></i> {{lang_share_photo}}
                    </button>
                </div>
                
                <!-- EXIF Column -->
                <div class="exif-card">
                    <h6 class="fw-bold mb-2">{{lang_exif_info}}</h6>
                    <div id="exif-info-container">
                        {{exif_info}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<template id="tmpl_exif_source_label">
    <div class="mb-2">
        <span style="font-size:0.65rem; padding:2px 8px; border-radius:12px; background:{{bg}}; color:{{color}}; font-weight:bold; display:inline-block;">{{lang_source}}: {{label}}</span>
    </div>
</template>

<template id="tmpl_exif_vertical_list">
    <div class="exif-vertical-list">{{items}}</div>
</template>

<template id="tmpl_exif_item">
    <div class="mb-1"><span class="text-muted">{{label}}</span> <strong>{{value}}</strong></div>
</template>

<template id="tmpl_exif_split_layout">
    <div class="exif-split-layout" style="display: flex; gap: 30px;">
        <div style="flex: 1;">
            {{left_content}}
        </div>
        <div style="flex: 1.5;">
            {{right_content}}
        </div>
    </div>
</template>

<template id="tmpl_gps_block">
    <div class="exif-item">
        <span class="text-muted small">{{lang_gps_coords}} </span>
        <strong>{{lang_latitude}}: {{lat}}, {{lang_longitude}}: {{lng}}</strong>
        
        <div class="map-preview-box mt-2" style="position:relative; height:360px; border-radius:8px; overflow:hidden; border:1px solid #ddd;">
            <iframe width="100%" height="100%" src="{{embedUrl}}" frameborder="0" style="border:0;" allowfullscreen></iframe>
            <a href="{{mapLink}}" target="_blank" class="map-overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.05); z-index:10; display:flex; align-items:center; justify-content:center; text-decoration:none; opacity:0; transition:opacity 0.3s;">
                <span class="badge bg-primary text-white shadow"><i class="bi bi-box-arrow-up-right"></i> {{lang_open_map}}</span>
            </a>
        </div>
    </div>
</template>

<template id="tmpl_share_item">
    <div class="share-item">
        <label class="small fw-bold" style="display:block; margin-bottom:4px;">{{label}}</label>
        <div class="input-group">
            <input type="text" value="{{url}}" readonly>
            <button class="btn btn-primary" onclick="copyToClipboard(this, '{{url}}')">{{lang_copy}}</button>
        </div>
    </div>
</template>

<!-- Fullscreen Photo Modal -->
<div id="photoModal" class="modal-overlay modal-fullscreen" onclick="closeModal('photoModal')">
    <div class="modal-close"><i class="bi bi-x-lg"></i></div>
    <img src="" id="modal-full-img" onclick="event.stopPropagation()">
</div>

<!-- Share Link Modal -->
<div id="shareModal" class="modal-overlay" onclick="closeModal('shareModal')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h5 class="fw-bold">{{lang_share_photo}}</h5>
            <button class="close-btn" onclick="closeModal('shareModal')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div class="d-flex justify-between align-center mb-3">
                <p class="text-muted small mb-0">{{lang_select_share_size}}</p>
                <label class="small fw-bold" style="cursor:pointer">
                    <input type="checkbox" id="toggle-original-url" onchange="updateShareLinks()" style="vertical-align: middle;"> {{lang_show_original_path}}
                </label>
            </div>
            <div id="share-links-container">
                <!-- JS will generate items here -->
            </div>
        </div>
    </div>
</div>

<script src="static/exif.js"></script>
<script>
    (function() {
        // 根據 <html lang> 決定語系檔名
        var langCode = document.documentElement.lang.replace('-', '_') || 'zh_TW';
        var version = (typeof APP_VERSION !== 'undefined' ? APP_VERSION : new Date().getTime());
        
        function loadScript(src, id) {
            return new Promise((resolve, reject) => {
                var s = document.createElement('script');
                s.src = src;
                if (id) s.id = id;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('Script load error: ' + src));
                document.body.appendChild(s);
            });
        }

        async function init() {
            try {
                // 1. 載入 JS 語言包
                await loadScript('langs/' + langCode + '.js?v=' + version);
                console.log('[Core] Language pack loaded: ' + langCode);

                // 2. 載入主程式 album.js
                await loadScript('static/album.js?v=' + version);
                console.log('[Core] Main script loaded');

                // 3. 載入主題插件
                const themeName = window.currentActiveTheme || (typeof albumConfig !== 'undefined' ? albumConfig.theme : 'album');
                if(themeName && themeName !== 'album') {
                    try {
                        await loadScript('static/themes/' + themeName + '/theme.js', 'theme-plugin-js');
                        console.log('[Theme] Plugin loaded: ' + themeName);
                        window.dispatchEvent(new CustomEvent('themePluginReady', { detail: { theme: themeName } }));
                    } catch(e) {
                        console.warn('[Theme] Optional JS plugin (theme.js) not found for: ' + themeName);
                    }
                }
            } catch (e) {
                console.error('[Fatal] App initialization failed:', e);
            }
        }

        init();
    })();
</script>
{{custom_scripts}}
</body>
</html>
