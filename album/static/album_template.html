<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - Baxermux的相簿</title>
    <link rel="stylesheet" href="{{path_to_static}}album.css">
    <script src="{{path_to_config}}config.js"></script>
    <script>
        if(typeof albumConfig !== 'undefined' && albumConfig.theme && albumConfig.theme !== 'album') {
            document.write('<link rel="stylesheet" href="{{path_to_static}}' + albumConfig.theme + '.css">');
        }
    </script>
</head>
<body>

<header class="header-bar">
    <div class="header-inner">
        <div class="mb-2">
            <h1 class="site-title">Baxermux的相簿</h1>
            <span class="site-desc">| &nbsp; 放一些Blog用到的素材照片</span>
        </div>
        <hr class="divider">
    </div>
</header>

<main class="main-content">
    <div id="album-header-section">
        {{album_header}}
    </div>
    {{content_body}}
    <div id="pagination-container"></div>
</main>

<footer class="footer"><p>&copy; 2026 Baxermux. All rights reserved.</p></footer>

<!-- Templates -->
<template id="tmpl_index_album_item">
    <a href="{{link}}" class="card">
        <div class="card-img-wrap ratio-1-1">
            <img src="{{cover}}" alt="{{name}}" class="card-img">
            <span class="card-badge"><i class="bi bi-images"></i> {{count}}</span>
        </div>
        <div class="card-body">
            <h2 class="card-title">{{name}}</h2>
            <p class="card-desc">{{desc}}</p>
        </div>
    </a>
</template>

<template id="tmpl_album_photo_item">
    <a href="{{photoPageLink}}" class="card">
        <div class="card-img-wrap ratio-3-2">
            <img src="{{imgSrc}}" alt="{{filename}}" class="card-img" loading="lazy">
        </div>
        <div class="card-body text-center" style="padding: 10px;">
            <div class="card-desc">{{photoDesc}}</div>
        </div>
    </a>
</template>

<template id="tmpl_photo_detail_view">
    <div class="d-flex align-center justify-between" style="margin-bottom: 20px;">
        <nav class="breadcrumb">
            <div class="breadcrumb-item"><a href="{{pathToHome}}album.html">首頁</a></div>
            <div class="breadcrumb-item"><a href="../{{albumName}}.html">{{albumName}}</a></div>
            <div class="breadcrumb-item active">{{filename}}</div>
        </nav>
        <a href="../{{albumName}}.html" class="btn btn-outline"><i class="bi bi-grid-3x3-gap"></i> 返回列表</a>
    </div>

    <div class="photo-viewer-container">
        <div class="photo-stage">
            <a href="{{prevLink}}" class="nav-btn" style="left:0"><i class="bi bi-chevron-left"></i></a>
            <img id="photo-main-viewer" src="{{imgSrc}}" alt="{{filename}}" onclick="openPhotoModal('{{imgSrcXL}}')" style="cursor:zoom-in">
            <a href="{{nextLink}}" class="nav-btn" style="right:0"><i class="bi bi-chevron-right"></i></a>
        </div>
        <div class="photo-meta-panel" style="padding: 25px; border-top: 1px solid #eee;">
            <div class="album-grid" style="grid-template-columns: 1fr 2fr; gap: 30px;">
                <!-- Info Column -->
                <div>
                    <h6 class="fw-bold mb-2">照片資訊</h6>
                    <p class="fw-bold" style="font-size:1.1rem; margin-bottom: 5px;">{{photoTitle}}</p>
                    <p class="text-muted small" style="margin-bottom: 15px;">{{photoDesc}}</p>
                    <hr class="divider" style="margin-bottom: 15px;">
                    <p class="text-muted small" style="margin-bottom: 15px;">檔案名稱: {{filename}}</p>
                    
                    <a href="{{imgSrcOriginal}}" download="{{filename}}" class="btn btn-primary w-100 mb-2">
                        <i class="bi bi-download"></i> 下載原始圖檔
                    </a>
                    <button class="btn btn-outline w-100" onclick="openShareModal('{{filename}}', '{{imgSrc}}', '{{imgSrcXL}}', '{{imgSrcOriginal}}', '{{shortIdStart}}')">
                        <i class="bi bi-share"></i> 分享照片連結
                    </button>
                </div>
                
                <!-- EXIF Column -->
                <div>
                    <h6 class="fw-bold mb-2">技術資訊 (EXIF)</h6>
                    <div class="album-grid" style="grid-template-columns: repeat(2, 1fr); gap: 10px;">
                        {{exif_info}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- Fullscreen Photo Modal -->
<div id="photoModal" class="modal-overlay modal-fullscreen" onclick="closeModal('photoModal')">
    <div class="modal-close"><i class="bi bi-x-lg"></i></div>
    <img src="" id="modal-full-img" onclick="event.stopPropagation()">
</div>

<!-- Share Link Modal -->
<div id="shareModal" class="modal-overlay" onclick="closeModal('shareModal')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h5 class="fw-bold">分享照片連結</h5>
            <button class="close-btn" onclick="closeModal('shareModal')"><i class="bi bi-x-lg"></i></button>
        </div>
        <div class="modal-body">
            <div class="d-flex justify-between align-center mb-3">
                <p class="text-muted small mb-0">選擇分享尺寸：</p>
                <label class="small fw-bold" style="cursor:pointer">
                    <input type="checkbox" id="toggle-original-url" onchange="updateShareLinks()" style="vertical-align: middle;"> 顯示原始路徑
                </label>
            </div>
            <div id="share-links-container">
                <!-- JS will generate items here -->
            </div>
        </div>
    </div>
</div>

<script src="{{path_to_static}}album.js"></script>
{{custom_scripts}}
</body>
</html>
