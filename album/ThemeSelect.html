<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主題選擇器 - Baxermux 相簿服務</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0078d4;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 40px 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }
        .theme-card {
            border: none;
            border-radius: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .theme-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
            background: #fff;
        }
        .theme-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .btn-preview {
            border-radius: 20px;
            padding: 8px 25px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .theme-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1 class="display-4 fw-bold text-dark mb-3">相簿主題預覽</h1>
        <p class="lead text-muted">選擇一個風格，體驗不同的視覺饗宴</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-house me-1"></i> 返回首頁</a>
            <a href="admin/" class="btn btn-outline-primary btn-sm"><i class="bi bi-gear me-1"></i> 後台設定</a>
        </div>
    </div>

    <div id="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="row g-4" id="theme-grid" style="display: none;">
        <!-- Themes will be injected here -->
    </div>
</div>

<script>
    async function loadThemes() {
        try {
            const response = await fetch('api/api_themes.php');
            const themes = await response.json();
            
            const grid = document.getElementById('theme-grid');
            const loading = document.getElementById('loading');
            
            themes.forEach(theme => {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4 col-xl-3';
                
                const isSpecial = theme.id.includes('win') || theme.id.includes('wasm') || theme.id.includes('matrix');
                
                col.innerHTML = `
                    <div class="card theme-card p-4 position-relative" onclick="window.open('album.html#style=${theme.id}', '_blank')">
                        ${isSpecial ? '<span class="badge bg-warning text-dark theme-badge">Special</span>' : ''}
                        <div class="theme-icon">
                            <i class="bi ${getIcon(theme.id)}"></i>
                        </div>
                        <h5 class="fw-bold mb-2">${theme.name}</h5>
                        <p class="text-muted small mb-4 flex-grow-1">${theme.desc}</p>
                        <div class="mt-auto">
                            <button class="btn btn-primary btn-preview w-100">
                                <i class="bi bi-box-arrow-up-right me-2"></i> 立即預覽
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
            
            loading.style.display = 'none';
            grid.style.display = 'flex';
            
        } catch (error) {
            console.error('Error loading themes:', error);
            document.getElementById('loading').innerHTML = '<p class="text-danger">載入主題失敗，請稍後再試。</p>';
        }
    }

    function getIcon(id) {
        if (id.includes('win11')) return 'bi-windows';
        if (id.includes('win')) return 'bi-microsoft';
        if (id.includes('matrix')) return 'bi-terminal-fill';
        if (id.includes('dark')) return 'bi-moon-stars-fill';
        if (id.includes('pink')) return 'bi-heart-fill';
        if (id.includes('terminal')) return 'bi-command';
        if (id.includes('y2k')) return 'bi-disc';
        if (id.includes('ie')) return 'bi-browser-edge';
        return 'bi-palette-fill';
    }

    window.addEventListener('load', loadThemes);
</script>

</body>
</html>
